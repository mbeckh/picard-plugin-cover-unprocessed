long_description = """Prefer already processed covers and save unprocessed versions.

The plugin adds a cover art provider which can search for both already processed images (i.e. thumbnails)
and unprocessed files while preferring the former.

The plugin also adds a column to the artwork tab in the info dialog to show the unprocessed image (if found).

The unprocessed image is saved alongside the music files using a configurable name and renamed automatically.
"""
categories = ["coverart"]
homepage = "https://github.com/mbeckh/picard-plugin-cover-unprocessed"
report_bugs_to = "https://github.com/mbeckh/picard-plugin-cover-unprocessed/issues"
min_python_version = "3.14"
